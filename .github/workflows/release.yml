name: Personal ARM64 Release

# @project-doc docs/operations/personal_release.md#release_pipeline
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable release tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: personal-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Tiantianr/TokenRouter'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Tiantianr/TokenRouter
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/tiantianr/tokenrouter
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release metadata
        id: metadata
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          test "$RELEASE_TAG" = "v$VERSION"
          grep -qx 'go 1.27.0' backend/go.mod
          SHA=$(git rev-parse HEAD)
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main
          test -n "$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")"
          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      # 依赖身份不同不复用旧代缓存；同代源码提交复用 Go 编译结果。
      - uses: actions/cache@v4
        with:
          path: .release-cache
          key: personal-arm64-go127-node22-pnpm9159-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'frontend/package.json', 'frontend/pnpm-lock.yaml') }}-${{ steps.metadata.outputs.sha }}
          restore-keys: |
            personal-arm64-go127-node22-pnpm9159-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'frontend/package.json', 'frontend/pnpm-lock.yaml') }}-

      - name: Build frontend once in Node container
        run: |
          mkdir -p .release-cache/pnpm
          docker run --rm -v "$PWD:/src" -v "$PWD/.release-cache/pnpm:/cache" -w /src/frontend node:22-alpine sh -ec '
            corepack enable
            corepack prepare pnpm@9.15.9 --activate
            pnpm install --frozen-lockfile --store-dir /cache
            pnpm run build
          '

      - name: Build ARM64 image binary in Go container
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
          RELEASE_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          mkdir -p .release-cache/go-mod .release-cache/go-build release-context/deploy release-context/backend
          docker run --rm -v "$PWD:/src" \
            -v "$PWD/.release-cache/go-mod:/go/pkg/mod" \
            -v "$PWD/.release-cache/go-build:/root/.cache/go-build" \
            -e RELEASE_VERSION -e RELEASE_SHA -e RELEASE_DATE \
            -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=arm64 -e GOTOOLCHAIN=local \
            -w /src/backend golang:1.27.0-alpine sh -ec '
              go build -trimpath -tags embed \
                -ldflags="-s -w -X main.Version=$RELEASE_VERSION -X main.Commit=$RELEASE_SHA -X main.Date=$RELEASE_DATE -X main.BuildType=image" \
                -o /src/release-context/sub2api ./cmd/server
            '
          cp deploy/docker-entrypoint.sh release-context/deploy/
          cp -R backend/resources release-context/backend/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Package the prebuilt binary
        uses: docker/build-push-action@v6
        with:
          context: release-context
          file: Dockerfile.goreleaser
          platforms: linux/arm64
          load: true
          tags: ghcr.io/tiantianr/tokenrouter:${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tiantianr/TokenRouter
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=personal-arm64-runtime
          cache-to: type=gha,mode=max,scope=personal-arm64-runtime

      - name: Verify image runtime tools
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker run --rm "$IMAGE:$VERSION" --version
          docker run --rm --entrypoint /usr/local/bin/pg_dump "$IMAGE:$VERSION" --version
          docker run --rm --entrypoint /usr/local/bin/psql "$IMAGE:$VERSION" --version
          test "$(docker image inspect "$IMAGE:$VERSION" --format '{{.Architecture}}')" = arm64

      # main 的对应 SHA 验证与构建并行，tag 不重新运行整套应用测试。
      - name: Require successful checks for the exact source commit
        env:
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          for workflow in backend-ci.yml security-scan.yml; do
            passed=false
            for _ in $(seq 1 90); do
              result=$(gh run list --workflow "$workflow" --commit "$RELEASE_SHA" --event push --limit 1 --json status,conclusion)
              status=$(jq -r '.[0].status // "missing"' <<< "$result")
              conclusion=$(jq -r '.[0].conclusion // ""' <<< "$result")
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                passed=true
                break
              fi
              sleep 20
            done
            test "$passed" = true
          done

      - name: Publish immutable image and release
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          # 已有 Release 必须人工核对后恢复，禁止覆盖已发布版本。
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          test -z "$existing"
          TOKEN=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" 'https://ghcr.io/token?service=ghcr.io&scope=repository:tiantianr/tokenrouter:pull' | jq -er .token)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/tiantianr/tokenrouter/manifests/$VERSION")
          case "$CODE" in
            200)
              docker pull "$IMAGE:$VERSION"
              test "$(docker image inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_SHA"
              ;;
            404) docker push "$IMAGE:$VERSION" ;;
            *) echo "Registry inspection failed: HTTP $CODE" >&2; exit 1 ;;
          esac
          docker pull "$IMAGE:$VERSION"
          PIN=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')
          # shellcheck disable=SC2016
          jq -n --arg version "$VERSION" --arg commit "$RELEASE_SHA" --arg image "$PIN" \
            '{version:$version,commit:$commit,image:$image,platform:"linux/arm64",build_type:"image"}' > release-manifest.json
          git tag -l --format='%(contents:body)' "$RELEASE_TAG" > release-notes.md
          # shellcheck disable=SC2016
          printf '\n## Image\n\n`%s:%s`\n\n`%s`\n\nCommit: `%s`\n' "$IMAGE" "$VERSION" "$PIN" "$RELEASE_SHA" >> release-notes.md
          gh release create "$RELEASE_TAG" release-manifest.json --verify-tag --latest \
            --title "TokenRouter $VERSION" --notes-file release-notes.md

      - name: Prepare caches for persistence
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .release-cache
